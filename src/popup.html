<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2129;
      --border: #30363d;
      --border-hover: #3d444d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #ffa116;
      --accent-soft: rgba(255, 161, 22, 0.14);
      --success: #2ea043;
      --danger: #f85149;
      --easy: #00b8a3;
      --medium: #ffc01e;
      --hard: #ff375f;
      --radius: 10px;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .mark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), #ff7a1a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mark svg { width: 12px; height: 12px; }

    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-left: auto;
      position: relative;
      flex-shrink: 0;
    }
    .status-dot.on { background: var(--success); }
    .status-dot.off { background: var(--text-muted); opacity: 0.5; }
    .status-dot.on::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid var(--success);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .repo-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    .repo-line .arrow { color: var(--accent); flex-shrink: 0; }
    .repo-line.unconfigured { color: var(--text-muted); font-style: italic; font-family: var(--sans); }

    .history {
      max-height: 260px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 16px;
      opacity: 0;
      transform: translateY(4px);
      animation: rise 0.28s ease forwards;
      transition: background 0.15s ease;
    }
    .history-item:hover { background: var(--surface-hover); }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .history-item .title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }

    .diff {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }
    .diff.Easy { background: rgba(0, 184, 163, 0.15); color: var(--easy); }
    .diff.Medium { background: rgba(255, 192, 30, 0.15); color: var(--medium); }
    .diff.Hard { background: rgba(255, 55, 95, 0.15); color: var(--hard); }

    .empty {
      color: var(--text-muted);
      font-size: 12.5px;
      text-align: center;
      padding: 32px 20px;
      line-height: 1.6;
    }

    .footer { padding: 12px 16px 14px; }

    button {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }
    button:hover { background: var(--surface-hover); border-color: var(--border-hover); }
    button:active { transform: scale(0.98); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h10M11 6l6 6-6 6" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>LeetPush</h1>
    <span id="statusDot" class="status-dot off"></span>
  </div>

  <div id="repoLine" class="repo-line unconfigured">Not configured yet</div>

  <div id="history" class="history"></div>

  <div class="footer">
    <button id="openOptions">Open settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
